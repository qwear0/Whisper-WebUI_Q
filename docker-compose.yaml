services:
  whisper-webui:
    container_name: whisper-webui
    build: .
    image: ${WHISPER_PREBUILT_IMAGE:-jhj0517/whisper-webui:latest}
    restart: unless-stopped
    stop_grace_period: 2m

    env_file:
      - .env

    environment:
        QSD_WHISPER_API_KEY: "${QSD_WHISPER_API_KEY:-}"
        # Retain loopback trust; add only the verified private gateway hop.
        FORWARDED_ALLOW_IPS: "127.0.0.1,${WHISPER_GATEWAY_PROXY_IP:-127.0.0.1}"
    volumes:
      # You can mount the container's volume paths to directory paths on your local machine.
      # Models will be stored in the `./models' directory on your machine.
      # Similarly, all output files will be stored in the `./outputs` directory.
      - ${WHISPER_STATE_ROOT:-.}/models:/Whisper-WebUI/models
      - ${WHISPER_STATE_ROOT:-.}/outputs:/Whisper-WebUI/outputs
      - ${WHISPER_STATE_ROOT:-.}/configs:/Whisper-WebUI/configs
      - /data/ObsidianVault/Inner/AI/Whisper_Results:/data/ObsidianVault/Inner/AI/Whisper_Results

    ports:
      - "7860:7860"

    stdin_open: true
    tty: true

    networks:
      - default
      - enigma_control_plane

    entrypoint: ["python", "app.py", "--server_port", "7860", "--server_name", "0.0.0.0",]

networks:
  enigma_control_plane:
    external: true
